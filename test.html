<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up</title>
    <style>
		.modal {
			display: none;
			position: fixed;
			z-index: 1000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
		}

		.modal-conteudo {
			background-color: white;
			width: 300px;
			padding: 20px;
			border-radius: 10px;
			margin: 15% auto;
			text-align: center;
			position: relative;
		}

		#fecharPopup {
			position: absolute;
			top: 10px;
			right: 15px;
			cursor: pointer;
			font-size: 24px;
		}
	</style>
</head>
<body>

    <button id="abrirPopup">Abrir Pop-up</button>

    <div id="popup" class="modal">
        <div class="modal-conteudo">
            <span id="fecharPopup">&times;</span>
            <h2>Olá!</h2>
            <p>Este é um pop-up criado com HTML, CSS e JavaScript.</p>
        </div>
    </div>

    <script>
		const popup = document.getElementById("popup");
		const abrir = document.getElementById("abrirPopup");
		const fechar = document.getElementById("fecharPopup");

		abrir.addEventListener("click", () => {
			popup.style.display = "block";
		});

		fechar.addEventListener("click", () => {
			popup.style.display = "none";
		});

		window.addEventListener("click", (event) => {
			if (event.target === popup) {
				popup.style.display = "none";
			}
		});
	</script>
</body>
</html>
