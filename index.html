<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Convite</title>
</head>
<body>
	<header>
		<div class="triangulo" id="triangulo"></div>
		<div class="caixa" id="caixa"></div>
	</header>
	<main>
		<div class="transparente"></div>
		<div class="content" id="content">
			<div class="linha">
				<div class="head">
					<section class="videoSectionEsquerodo">
						<video id="meuVideoEsquerdo" muted>
						<source src="Assets/midia/videos/Flores.webm">
					</section>
					<section class="videoSectionDireito">
						<video id="meuVideoDireito" muted>
						<source src="Assets/midia/videos/Flores.webm">
					</section>
					<div class="titulo">
						<h1>Débora</h1>
						<h1>e</h1>
						<h1>Gadyel</h1>
					</div>
				</div>
				
				<div class="container">
					<div class="text-1">
						<p>
							O amor encurtou distâncias, transformou saudades em certezas e fez de cada reencontro um momento inesquecível. 
							Por isso, é com imensa alegria que convidamos você a fazer parte do capítulo mais especial da nossa história: o nosso casamento.
						</p>
					</div>
					<div class="data" id="data" type="button">
						<div class="topo">
							<div class="margem">
								<h3>QUINTA</h3>
							</div>
							<div class="mes-dia">
								<h2>19</h2>
							</div>
							<div class="margem">
								<h3>NOVEMBRO</h3>
							</div>
						</div>
						<div class="ano">
							<h3>2026</h3>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	<footer id="footer">
		<div class="borda" id="borda"></div>
	</footer>
	<script src="main.js"></script>
</body>
</html>
